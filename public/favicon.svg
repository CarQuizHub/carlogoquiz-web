<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <!-- Semi-circle arc (top half) -->
  <path d="M 8,36 A 24,24 0 1,1 56,36" fill="none" stroke="#ff3c00" stroke-width="8" stroke-linecap="round"/>
  <!-- Bottom closing stroke -->
  <path d="M 8,36 Q 8,56 28,56" fill="none" stroke="#ff3c00" stroke-width="8" stroke-linecap="round"/>
  <!-- Q tail / needle -->
  <line x1="40" y1="46" x2="58" y2="58" stroke="#ff3c00" stroke-width="8" stroke-linecap="round"/>
  <!-- Needle from center -->
  <line x1="32" y1="32" x2="44" y2="18" stroke="#ff3c00" stroke-width="5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3.5" fill="#ff3c00"/>
</svg>
